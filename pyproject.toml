[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-webui"
version = "0.50.205"
description = "Hermes Web UI - Local-first web interface for Claude"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
hermes-webui = "server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*"]

[tool.setuptools.package-data]
api = ["*.html", "*.css", "*.js"]
